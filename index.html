<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novita Gunawan — Software Developer & Coding Mentor</title>
    <!-- Bootstrap 5 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Scripts -->
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <!-- HEADER -->
    <header class="site-header" id="top">
      <nav class="navbar container">
        <a
          class="d-flex align-items-center gap-2"
          href="#top"
          style="text-decoration: none"
        >
          <img
            alt="Profile"
            src="/assets/me.JPG"
            class="rounded"
            style="width: 50px; height: 50px; object-fit: cover"
          />
          <div class="d-flex flex-column justify-content-center">
            <span class="text-white fw-bold" style="font-size: 1.1rem"
              >Novita Gunawan</span
            >
            <span class="text-white-50" style="font-size: 0.85rem"
              >Software Developer</span
            >
          </div>
        </a>

        <!-- Hamburger Button -->
        <button
          class="nav-toggle"
          type="button"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Menu -->

        <div class="nav-menu" id="nav-menu">
          <a class="nav-link" href="#about">About</a>
          <a class="nav-link" href="#skills">Skills</a>
          <a class="nav-link" href="#projects">Projects</a>
          <a class="nav-link" href="#contact">Contact</a>
        </div>
        <!-- Menu -->
      </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content">
      <!-- HERO -->
      <section class="hero section" id="about">
        <div class="container">
          <div class="hero-row">
            <!-- LEFT: Hero Image -->
            <div class="col-lg-5 col-md-5">
              <div class="hero-image-wrapper">
                <img
                  src="/assets/me.JPG"
                  alt="Novita Gunawan"
                  class="hero-image"
                />
              </div>
            </div>

            <!-- RIGHT: Hero Text -->

            <div class="col-lg-7 col-md-7">
              <p class="text-eyebrow mono">
                // hello,
                <span class="typing-wrapper">
                  <span class="typing-text"></span
                  ><span class="typing-cursor">|</span>
                </span>
              </p>
              <h1>
                I'm
                <span class="chalk-underline">
                  Novi

                  <svg viewBox="0 0 300 14" preserveAspectRatio="none">
                    <path
                      d="M2,9 C60,2 120,13 160,7 C210,1 260,10 298,5"
                      stroke="#F2A93B"
                      stroke-width="4"
                      fill="none"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
              </h1>

              <p>
                A software developer of
                <span class="text-secondary-mono">4 years</span>
                building websites &amp; mobile apps — who occasionally also
                teach younger learners from kindergarten to senior high school.
              </p>

              <!-- Develop Stats -->
              <div class="hero-stats">
                <div class="hero-stat">
                  <span class="stat-number" data-target="4">0</span>
                  <span class="stat-plus">+</span>
                  <p class="stat-label">Websites</p>
                </div>

                <div class="hero-stat">
                  <span class="stat-number" data-target="10">0</span>
                  <span class="stat-plus">+</span>
                  <p class="stat-label">Mobile Apps</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Skills -->
      <section class="hero section" style="background-color: red"></section>
    </main>

    <!-- Footer -->
    <footer></footer>
  </body>
</html>
